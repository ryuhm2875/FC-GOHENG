<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>고흥FC 드림 프로젝트</title>
  <meta name="description" content="고흥대서중 축구부 학생선수의 3년을 키우는 육성 시뮬레이션">
  <meta name="theme-color" content="#070A1C">
  <link rel="icon" href="assets/img/logo.png">
  <link rel="apple-touch-icon" href="assets/img/logo.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/fc.css">
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
    // 인터넷 주소(GitHub Pages)로 열면 js/main.js를, 파일을 더블클릭해서 열면 한 파일로 묶은 js/game.bundle.js를 씁니다.
    (function () {
      var s = document.createElement("script");
      if (location.protocol === "file:") s.src = "js/game.bundle.js";
      else { s.type = "module"; s.src = "js/main.js"; }
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
